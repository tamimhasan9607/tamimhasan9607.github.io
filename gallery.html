<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script>document.documentElement.dataset.theme = 'light'; try { var p = localStorage.getItem('palette'); if (/^(cream|blue|green|purple)$/.test(p)) document.documentElement.dataset.palette = p; } catch (e) {}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Tamim</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">

    <!-- SEO -->
    <meta name="description" content="Moments and memories from Tamim's journey.">
    <meta name="keywords" content="Tamim, ScrumMaster, Tech Innovator, Business Analyst, Portfolio, VR Developer, Federation University">
    <meta name="author" content="Tamim">
    <link rel="canonical" href="https://tamim.live/gallery.html">

    <!-- Open Graph (social media previews) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tamim.live/gallery.html">
    <meta property="og:title" content="Gallery | Tamim">
    <meta property="og:description" content="Moments and memories from Tamim's journey.">
    <meta property="og:image" content="https://tamim.live/assets/tamim.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gallery | Tamim">
    <meta name="twitter:description" content="Moments and memories from Tamim's journey.">
    <meta name="twitter:image" content="https://tamim.live/assets/tamim.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css?v=36">

</head>
<body>
    <div class="bg-pattern"></div>
    <div class="bg-gradient"></div>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-mark">TH</span>
                <span class="logo-text">Tamim</span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about-details.html" class="nav-link">About</a></li>
                <li><a href="projects.html" class="nav-link">Showcase</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <button class="hamburger" id="hamburger" aria-label="Menu">
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content page-main">
<section id="gallery" class="gallery section-padding">
    <div class="container">
        <div class="section-header" data-animate="fade-up">
            <span class="section-tag">Gallery</span>
            <h1 class="section-title">Moments & Memories</h1>
        </div>
    </div>

    <div class="tv-gallery" id="tvGallery" role="region" aria-roledescription="carousel" aria-label="Photo gallery" data-animate="fade-up" data-delay="200">
        <div class="tv-viewport">
            <div class="tv-track" id="tvTrack">
                <figure class="tv-slide">
                    <img src="assets/1.webp" alt="Tamim gallery photo 1" draggable="false">
                </figure>
                <figure class="tv-slide">
                    <img src="assets/2.webp" alt="Tamim gallery photo 2" draggable="false">
                </figure>
                <figure class="tv-slide">
                    <img src="assets/3.webp" alt="Tamim gallery photo 3" draggable="false">
                </figure>
                <figure class="tv-slide">
                    <img src="assets/4.webp" alt="Tamim gallery photo 4" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide">
                    <img src="assets/5.webp" alt="Tamim gallery photo 5" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide" style="--focus: 20%">
                    <img src="assets/6.webp" alt="Tamim gallery photo 6" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide" style="--focus: 60%">
                    <img src="assets/7.webp" alt="Tamim gallery photo 7" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide" style="--focus: 30%">
                    <img src="assets/8.webp" alt="Tamim gallery photo 8" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide" style="--focus: 20%">
                    <img src="assets/9.webp" alt="Tamim gallery photo 9" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide">
                    <img src="assets/10.webp" alt="Tamim gallery photo 10" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide">
                    <img src="assets/11.webp" alt="Tamim gallery photo 11" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide">
                    <img src="assets/12.webp" alt="Tamim gallery photo 12" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide" style="--focus: 30%">
                    <img src="assets/13.webp" alt="Tamim gallery photo 13" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide">
                    <img src="assets/14.webp" alt="Tamim gallery photo 14" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide">
                    <img src="assets/15.webp" alt="Tamim gallery photo 15" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide">
                    <img src="assets/16.webp" alt="Tamim gallery photo 16" loading="lazy" draggable="false">
                </figure>
                <figure class="tv-slide" style="--focus: 15%">
                    <img src="assets/17.webp" alt="Tamim gallery photo 17" draggable="false">
                </figure>
                <figure class="tv-slide" style="--focus: 25%">
                    <img src="assets/18.webp" alt="Tamim gallery photo 18" draggable="false">
                </figure>
            </div>

            <button class="tv-arrow prev" id="galleryPrev" aria-label="Previous photo">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="tv-arrow next" id="galleryNext" aria-label="Next photo">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div class="tv-controls">
            <div class="tv-dots" id="galleryDots"></div>
            <button class="tv-play" id="galleryPlay" aria-label="Pause slideshow">
                <i class="fas fa-pause"></i>
            </button>
        </div>
    </div>
</section>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer-copyright">&copy; 2026 Tamim. All rights reserved.</p>
        </div>
    </footer>
    <div class="corner-controls">
        <button class="theme-toggle fullscreen-toggle" id="fullscreenToggle" aria-label="Enter fullscreen" title="Fullscreen" hidden>
            <i class="fas fa-expand"></i>
            <i class="fas fa-compress"></i>
        </button>
        <div class="palette" id="palette">
            <button type="button" class="palette-toggle" id="paletteToggle" aria-label="Change site colors" aria-expanded="false">
                <i class="fas fa-palette"></i>
            </button>
            <div class="palette-swatches" role="group" aria-label="Site colors">
                <button type="button" class="palette-swatch" data-palette-choice="default" style="--swatch: #ffffff" aria-label="White"></button>
                <button type="button" class="palette-swatch" data-palette-choice="cream" style="--swatch: #ece6d4" aria-label="Cream"></button>
                <button type="button" class="palette-swatch" data-palette-choice="blue" style="--swatch: #004293" aria-label="Blue"></button>
                <button type="button" class="palette-swatch" data-palette-choice="green" style="--swatch: #015422" aria-label="Green"></button>
                <button type="button" class="palette-swatch" data-palette-choice="purple" style="--swatch: #36004e" aria-label="Purple"></button>
            </div>
        </div>
    </div>

    <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="script.js?v=14"></script>
</body>
</html>
