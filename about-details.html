<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script>document.documentElement.dataset.theme = 'light'; try { var p = localStorage.getItem('palette'); if (/^(cream|blue|green|purple)$/.test(p)) document.documentElement.dataset.palette = p; } catch (e) {}</script>

</head>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-mark">TH</span>
                <span class="logo-text">Tamim</span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about-details.html" class="nav-link active">About</a></li>
                <li><a href="projects.html" class="nav-link">Showcase</a></li>

                <button class="hamburger" id="hamburger" aria-label="Menu">
                    <span></span>
                    <span></span>
                </button>

    <main class="main-content page-main">
        <section class="coming-soon">

    <footer class="footer">
        <div class="container">
            <p class="footer-copyright">&copy; 2026 Tamim. All rights reserved.</p>
        </div>

    <div class="corner-controls">
        <button class="theme-toggle fullscreen-toggle" id="fullscreenToggle" aria-label="Enter fullscreen" title="Fullscreen" hidden>
            <i class="fas fa-expand"></i>
            <i class="fas fa-compress"></i>
        </button>
        <div class="palette" id="palette">
            <button type="button" class="palette-toggle" id="paletteToggle" aria-label="Change site colors" aria-expanded="false">
                <i class="fas fa-palette"></i>
            </button>
            <div class="palette-swatches" role="group" aria-label="Site colors">
                <button type="button" class="palette-swatch" data-palette-choice="default" style="--swatch: #ffffff" aria-label="White"></button>
                <button type="button" class="palette-swatch" data-palette-choice="cream" style="--swatch: #ece6d4" aria-label="Cream"></button>
                <button type="button" class="palette-swatch" data-palette-choice="blue" style="--swatch: #004293" aria-label="Blue"></button>
                <button type="button" class="palette-swatch" data-palette-choice="green" style="--swatch: #015422" aria-label="Green"></button>
                <button type="button" class="palette-swatch" data-palette-choice="purple" style="--swatch: #36004e" aria-label="Purple"></button>
            </div>
        </div>
    </div>

    <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="script.js?v=14"></script>
</body>
