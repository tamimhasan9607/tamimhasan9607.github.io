<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* Matches the header logo mark: dark square, white letters.
       Inverts on a dark browser theme so the icon never disappears
       into the tab strip. */
    .plate { fill: #1f1f1f; }
    .mark  { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #f2f5f9; }
      .mark  { fill: #0e1117; }
    }
  </style>
  <rect class="plate" width="64" height="64"/>
  <text class="mark" x="32" y="44"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1"
        text-anchor="middle">TH</text>
</svg>
