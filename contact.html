<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script>document.documentElement.dataset.theme = 'light'; try { var p = localStorage.getItem('palette'); if (/^(cream|blue|green|purple)$/.test(p)) document.documentElement.dataset.palette = p; } catch (e) {}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Tamim</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">

    <!-- SEO -->
    <meta name="description" content="Get in touch with Tamim.">
    <meta name="keywords" content="Tamim, ScrumMaster, Tech Innovator, Business Analyst, Portfolio, VR Developer, Federation University">
    <meta name="author" content="Tamim">
    <link rel="canonical" href="https://tamim.live/contact.html">

    <!-- Open Graph (social media previews) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tamim.live/contact.html">
    <meta property="og:title" content="Contact | Tamim">

    <meta property="og:image" content="https://tamim.live/assets/tamim.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact | Tamim">
    <meta name="twitter:description" content="Get in touch with Tamim.">
    <meta name="twitter:image" content="https://tamim.live/assets/tamim.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css?v=36">

</head>
<body>
    <div class="bg-pattern"></div>
    <div class="bg-gradient"></div>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-mark">TH</span>
                <span class="logo-text">Tamim</span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about-details.html" class="nav-link">About</a></li>
                <li><a href="projects.html" class="nav-link">Showcase</a></li>
                <li><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <button class="hamburger" id="hamburger" aria-label="Menu">
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content page-main">
    <section id="contact" class="contact section-padding">
        <div class="container">
            <div class="contact-wrapper">
                <div class="contact-info" data-animate="fade-right">
                    <div class="section-header left">
                        <span class="section-tag">Contact</span>
                        <h1 class="section-title">Let's Connect</h1>
                    </div>

                    <div class="contact-methods">
                        <div class="contact-method">
                            <div class="method-details">
                                <span class="method-label">Email</span>
                                <a href="mailto:tamim.hasan9607@gmail.com">tamim.hasan9607@gmail.com</a>
                            </div>
                        </div>
                    </div>

                    <div class="social-links">
                        <a href="https://github.com/tamimhasan9607" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://linkedin.com/in/tamim9607" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    </div>
                </div>

                <div class="contact-form-wrapper" data-animate="fade-left">
                    <form id="contactForm" class="contact-form" action="https://formspree.io/f/mbdapydr" method="POST">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Your name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="youremail@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="4" placeholder="Tell me about your project..." required></textarea>
                        </div>
                        <input type="hidden" name="_replyto" value="tamim.hasan9607@gmail.com">
                        <button type="submit" class="btn btn-primary btn-full">
                            <span>Send Message</span> <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer-copyright">&copy; 2026 Tamim. All rights reserved.</p>
        </div>
    </footer>
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span>Message sent successfully!</span>
    </div>

    <div class="corner-controls">
        <button class="theme-toggle fullscreen-toggle" id="fullscreenToggle" aria-label="Enter fullscreen" title="Fullscreen" hidden>
            <i class="fas fa-expand"></i>
            <i class="fas fa-compress"></i>
        </button>
        <div class="palette" id="palette">
            <button type="button" class="palette-toggle" id="paletteToggle" aria-label="Change site colors" aria-expanded="false">
                <i class="fas fa-palette"></i>
            </button>
            <div class="palette-swatches" role="group" aria-label="Site colors">
                <button type="button" class="palette-swatch" data-palette-choice="default" style="--swatch: #ffffff" aria-label="White"></button>
                <button type="button" class="palette-swatch" data-palette-choice="cream" style="--swatch: #ece6d4" aria-label="Cream"></button>
                <button type="button" class="palette-swatch" data-palette-choice="blue" style="--swatch: #004293" aria-label="Blue"></button>
                <button type="button" class="palette-swatch" data-palette-choice="green" style="--swatch: #015422" aria-label="Green"></button>
                <button type="button" class="palette-swatch" data-palette-choice="purple" style="--swatch: #36004e" aria-label="Purple"></button>
            </div>
        </div>
    </div>

    <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="script.js?v=14"></script>
</body>
</html>
